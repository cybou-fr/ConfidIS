# CONFIDIS node reverse proxy
#
# Port model (no subdomains):
#   • Public HTTPS : https://confidis.fr        — Nginx, port 443 (added by certbot)
#   • HTTP         : port 80 → 443 redirect  (added by certbot --nginx)
#   • Node backend : 127.0.0.1:4433          — localhost only, never public
#
# The confidis-node process serves the public owner-facing web surface and the
# signed protocol endpoints on 127.0.0.1:4433. Operator/authority management
# is deliberately absent from this Internet-facing virtual host.
# The Web UI is the path /ui/ on the same domain — there is no app./node.
# subdomain. Other CONFIDIS nodes also reach this node at https://confidis.fr (443).
#
# deploy.sh rewrites the literal "confidis.fr" below to the chosen --domain;
# `certbot --nginx -d <domain>` then adds the 443 TLS server and the 80→443
# redirect for this single apex domain.

server {
    listen 80;
    listen [::]:80;
    server_name confidis.fr;

    # Allow ACME HTTP-01 challenge before TLS exists.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Large client-side-encrypted shard uploads. Beta file-size limits are
    # enforced by the node; this is the transport ceiling.
    client_max_body_size 512m;

    # Production public boundary: local management plus legacy CYB routes stay
    # off the Internet-facing surface. Keep this denial even though the node
    # also rejects these routes, so a SPA fallback cannot mask a configuration
    # regression.
    location ~ ^/(ledger|operator)(/|$) {
        return 404;
    }

    location = /authority {
        return 404;
    }

    location ~ ^/(maintenance|metrics|receipts)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4433;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large uploads/downloads instead of buffering to disk.
        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
