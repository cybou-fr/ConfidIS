<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plasmaGradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0AA6C7"/>
      <stop offset="50%" stop-color="#45F3FF"/>
      <stop offset="100%" stop-color="#E6FCFF"/>
    </linearGradient>

    <linearGradient id="armorGradient" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="rimGradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#45F3FF" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="hologramGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="80" fill="url(#plasmaGradient)" filter="url(#hologramGlow)" opacity="0.3"/>

